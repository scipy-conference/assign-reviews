[workspace]
name = "assign-reviews"
version = "0.1.0"
description = "Workflow to assign reviewers for the SciPy Conference"
authors = [
    "Guen Prawiroatmodjo",
    "Matthew Feickert <matthew.feickert@cern.ch>",
    "Gil Forsyth",
    "Naty Clementi",
]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tasks]
pre-processing = "cd notebooks && python pre-processing.py"
pre-processing-ibis = "cd notebooks && python pre-processing-ibis.py"
assignments = "cd notebooks && python run-assignments.py"

[dependencies]
python = "3.12.*"
scipy = ">=1.10.0"
pandas = ">=2.2.0"
notebook = ">=7.1.2"
jupytext = ">=1.10.0"
ibis-duckdb = ">=10.2.0,<12.1"
ipython = ">=9.0.2,<10"
python-duckdb = ">=1.2.0,<2"

[feature.test.tasks]
test = "coverage run --module pytest tests/"

[feature.test.dependencies]
pytest = ">=8.0.0"
coverage = ">=7.0.0"

[feature.lint.tasks]
lint = "pre-commit run --all-files"
ruff = "ruff check ."
black = "black . --verbose"

[feature.lint.dependencies]
pre-commit = ">=3.7.0"
ruff = ">=0.3.4"
black = ">=24.3.0"

[environments]
test = ["test"]
lint = ["lint"]
